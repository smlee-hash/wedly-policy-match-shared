# 3앱 자동 반영 봇 — 설계서 §6 D1·D2, 계획서 docs/superpowers/plans/2026-09-07-p5-propagate-bot.md
#
# 무엇을 하나: 이 보관함 main 에 커밋이 올라가 CI 가 통과하면, 앱 3곳(ERP·일루아·랩)의
#   `@wedly/policy-match-shared` 핀을 새 커밋으로 올려 커밋·푸시한다. Railway 가 그 push 를 보고 배포한다.
#   사람이 손으로 핀을 맞추던 일(회당 30~60분)을 없앤다.
#
# 언제 도나: CI 워크플로우가 **main 에서 성공**했을 때(workflow_run). 손으로는 Actions 화면의
#   「Run workflow」(workflow_dispatch) — 예행연습(dry_run)이 기본으로 켜져 있다.
# 끄기:  저장소 변수 `PROPAGATE_ENABLED=false` (변수가 아예 없으면 켜진 것으로 본다).
#        ★이 스위치는 **자동 실행(CI 성공 뒤)만** 막는다 — 손으로 돌리는 것(Actions 화면의
#        「Run workflow」)은 꺼져 있어도 된다(2026-09-08 2차 리뷰 F8). 그래야 첫 가동 절차
#        (「끄고 → 밀고 → 예행으로 확인 → 켠다」)가 성립하고, 꺼 둔 동안에도 사람이 손으로
#        한 앱을 맞출 수 있다.
# 시크릿:
#   `PROPAGATE_READ_TOKEN`       — 앱 3저장소 **읽기 전용** PAT. 클론에만 쓴다.
#   `PROPAGATE_TOKEN`            — 앱 3저장소 contents:write PAT. **밀기에만** 쓴다.
#   `WEDLY_NOTIFY_KEY`           — ERP 내부 알림 열쇠. **밀기 job 에만** 준다(아래 ★알림 지점).
#   `PROPAGATE_ARTIFACT_PRIVKEY` — 산출물 봉인을 푸는 비밀키 PEM. **밀기 job 에만** 준다.
# 변수:
#   `PROPAGATE_ENABLED`          — 끄는 스위치(자동 실행만 막는다).
#   `WEDLY_NOTIFY_URL`           — ERP 주소.
#   `PROPAGATE_ARTIFACT_PUBKEY`  — 산출물을 봉인하는 공개키 PEM(비밀이 아니라 **변수**다).
#
# ★산출물은 봉인해서 올린다(2026-09-08 총괄 결정 F9):
#   이 저장소는 **공개**라 Actions 산출물은 누구나 내려받는다. 그런데 그 안에는 비공개 앱 3곳의
#   package.json·잠금 파일·설계 등록부가 들어 있다. 그래서 준비 job 은 평문 대신 공개키로 봉인한
#   `bundle.enc`·`key.enc` 만 올리고, 밀기 job 만 비밀키로 그것을 푼다. 공개키 변수가 비어 있으면
#   준비 job 은 **아무것도 올리지 않고 실패한다** — 실수로라도 평문이 올라가는 길을 두지 않는다.
#
# ★알림 지점은 밀기 job 한 곳뿐이다(2026-09-08 2차 리뷰 F1·F7):
#   준비 job 의 실행기는 **앱 코드가 이미 한 번 돈 자리**라 거기서 알림 열쇠를 쓰면
#   변조된 `notify.sh` 하나로 열쇠가 샌다. 그래서 준비 job 에는 클론 step 의 읽기 토큰 말고
#   어떤 시크릿도 없고, 준비가 죽으면 사유를 산출물 `meta.json{result:"failed"}` 에 담아 보낸다.
#   밀기 스크립트가 그것을 읽어 빨갛게 끝내고, 이 job 의 `failure()` 알림이 그 사유까지 알린다.
#
# ★job 이 둘인 이유 — 토큰과 앱 코드를 같은 자리에 두지 않는다(2026-09-08 리뷰 R2):
#   `prepare` 는 **읽기 전용 토큰으로 클론만** 하고, 그 뒤 토큰 없는 단계에서 npm·앱 후처리를 돌려
#   커밋할 파일만 artifact 로 올린다. `push` 는 그 파일을 받아 **새로 깨끗하게 클론**한 자리에 얹어
#   커밋·푸시만 한다(npm·앱 코드가 한 줄도 돌지 않는다).
#   같은 job 안에서 `env -u` 로 토큰을 지우는 것으로는 부족하다: 같은 사용자면 부모 프로세스의 환경을
#   읽을 수 있고, 앱 코드가 askpass 도우미나 `.git/config` 를 바꿔 뒤 푸시에서 자격을 가로챌 수 있다.
#
# ★스크립트 인젝션 막기 — 이 파일의 규칙 하나:
#   커밋 제목·사람이 적는 입력처럼 **믿을 수 없는 값은 `run:` 문자열에 `${{ }}` 로 넣지 않는다.**
#   그렇게 넣으면 그 값이 셸 명령의 일부가 되어 그대로 실행된다(제목에 `$(...)` 를 넣은 커밋 하나면 끝난다).
#   전부 `env:` 로 넘기고 셸에서는 `"$변수"` 로 읽는다 — 셸이 값을 명령이 아니라 자료로 다룬다.
name: Propagate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # 이 걸림쇠는 **CI 가 돌던 가지**(workflow_run.head_branch)를 본다.
    # 실측 2026-09-08: 같은 커밋이라도 `pipe/…` 가지의 CI 실행은 여기서 걸러진다.
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "예행연습(커밋만 만들고 푸시하지 않음)"
        type: boolean
        default: true
      sha:
        description: "반영할 패키지 커밋 40자리(비우면 main 끝)"
        type: string
        default: ""

# 한 번에 한 실행만 — 늦게 온 반영이 먼저 온 반영을 앞지르지 못하게. 취소하지 않고 줄을 세운다
# (취소하면 이미 핀을 바꾼 앱만 남아 3앱이 갈라진다).
# ★손으로 돌린 것은 **다른 줄**에 세운다(리뷰 R3): 예행은 아무것도 밀지 않으므로 실제 반영과
#  겹쳐도 무해한데, 같은 줄에 두면 예행 하나가 **대기 중인 진짜 반영을 취소**해 버린다.
# ★2차 리뷰 F5: 손 실행도 **예행(dry)과 실제(manual)를 다시 갈랐다.** 둘을 한 줄에 두면
#  「예행을 눌러 보는 사이에 손으로 부탁한 진짜 반영이 밀려난다」가 그대로 남는다.
#  줄은 셋이다 — `propagate-main`(자동) · `propagate-manual`(손 실제) · `propagate-dry`(손 예행).
# ★같은 줄에서 대기 중인 실행은 GitHub 가 **최신 것 하나만** 남긴다. main 은 직선이라
#  최신 커밋이 앞 커밋을 포함하므로, 중간 실행이 버려져도 반영 결과는 같다.
concurrency:
  group: propagate-${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'dry' || 'manual') || 'main' }}
  cancel-in-progress: false

# 이 워크플로우는 자기 저장소를 읽기만 한다. 앱 3곳을 다루는 권한은 기본 토큰이 아니라
# 시크릿 PAT 두 개에서 온다 — 기본 토큰은 다른 저장소에 아무 권한이 없다.
permissions:
  contents: read
  # 아래 「최신 커밋으로 올림」이 CI 실행 목록을 물어보는 데만 쓴다(2026-09-08 2차 리뷰 F6).
  actions: read

jobs:
  # 1단계: 무엇을 반영할지 하나로 정한다(SHA·커밋 제목·예행 여부). 3갈래가 각자 정하지 않게.
  resolve:
    # 변수가 없으면 빈 값이라 `!= 'false'` 가 참 = 켜짐. `false` 를 넣은 동안은 **자동 실행만** 건너뛴다
    # (2차 리뷰 F8): 손으로 돌리는 것은 꺼져 있어도 돈다 — 그래야 첫 가동 절차의 「끄고 밀고 예행」이 되고,
    # 꺼 둔 동안 사람이 한 앱을 손으로 맞출 수도 있다.
    # 두 번째·세 번째 줄(리뷰 R2)은 **남의 복제본에서 온 CI 실행**을 막는다 — 아래 pick 단계가
    # 「main 의 조상인가」로 한 번 더 막지만, 겹으로 세워 둔다(공개 저장소라 누구나 CI 를 돌릴 수 있다).
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.PROPAGATE_ENABLED != 'false') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      subject: ${{ steps.pick.outputs.subject }}
      dry_run: ${{ steps.pick.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 핀이 앞으로만 가는지(후손 검사) 보려면 옛 커밋까지 있어야 한다.
          fetch-depth: 0

      - id: pick
        shell: bash
        env:
          # ↓ 셋 다 믿을 수 없는 값이라 env 로만 받는다(위 「스크립트 인젝션 막기」)
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          # 「최신 커밋으로 올림」이 CI 실행 목록을 물어볼 때만 쓴다(권한은 actions: read 뿐)
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            SHA="${INPUT_SHA:-}"
            [ -n "$SHA" ] || SHA="$(git rev-parse origin/main)"
            # boolean 입력도 run: 안에서는 "true"/"false" **글자**로 온다.
            case "${INPUT_DRY_RUN:-true}" in
              true|True|TRUE|1) DRY=true ;;
              *) DRY=false ;;
            esac
          else
            # workflow_run 이 알려 주는 「CI 가 돈 커밋」. 실측 2026-09-08: 40자리 SHA 로 온다.
            SHA="${WORKFLOW_RUN_SHA:-}"
            DRY=false
          fi

          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::반영할 커밋이 40자리 SHA 가 아닙니다: '$SHA'"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main 2>/dev/null; then
            echo "::error::그 커밋은 main 에 없습니다(지워졌거나 다른 갈래): $SHA"
            exit 1
          fi

          # ★늦게 끝난 옛 CI 가 최신 핀을 못 밀어내게(2026-09-08 2차 리뷰 F6 · 3차 리뷰 G3 으로 넓힘):
          #  같은 줄(concurrency)에서 대기 중인 실행은 GitHub 가 **최신 하나만** 남긴다. 그래서
          #  「옛 커밋의 CI 가 늦게 끝나 뒤늦게 도착 → 최신 커밋의 대기 실행을 밀어냄」이 되면
          #  앱 핀이 **한 커밋 뒤에서 멈춘 채** 아무도 모르게 남는다.
          #
          #  ★G3(3차 리뷰): 옛 판은 **끝 커밋(TIP) 하나만** 물어봤다. TIP 의 CI 가 아직 안 끝났거나
          #   빨간 상태면 승격이 통째로 없던 일이 되어, 그 사이에 있던 **CI 를 통과한 중간 커밋(B)** 을
          #   아무도 반영하지 않았다. 그래서 이제 `SHA..TIP` 을 **최신부터 훑어** CI 성공 기록이 있는
          #   첫 커밋을 고른다. 한 번에 최대 30개만 본다(호출 수 상한 — 넘어가면 원래 커밋 그대로).
          #   물어보다 실패하거나 성공 기록이 0이면 다음 커밋으로 넘어가고, 끝까지 못 찾으면
          #   원래 커밋으로 간다 — 이 승격은 **막지 않는다**(있으면 좋은 것).
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            TIP="$(git rev-parse origin/main)"
            if [ "$TIP" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$TIP" 2>/dev/null; then
              PROMOTE=""
              while IFS= read -r CAND; do
                [ -n "$CAND" ] || continue
                CAND_RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${CAND}&status=success&per_page=1" --jq '.total_count' || echo "")"
                case "$CAND_RUNS" in
                  ""|0|*[!0-9]*)
                    echo "propagate: ${CAND} 의 CI 성공 기록을 찾지 못했습니다(total_count='${CAND_RUNS}') — 한 커밋 앞으로"
                    ;;
                  *)
                    PROMOTE="$CAND"
                    break
                    ;;
                esac
              done < <(git rev-list --first-parent -n 30 "${SHA}..${TIP}")
              if [ -n "$PROMOTE" ]; then
                echo "propagate: 최신 커밋으로 올림 — ${SHA} → ${PROMOTE} (그 커밋의 CI 도 이미 통과)"
                SHA="$PROMOTE"
              else
                echo "propagate: ${SHA} 뒤 커밋(최대 30개)에서 CI 성공 기록을 찾지 못해 그대로 갑니다"
              fi
            fi
          fi

          # git 의 %s(제목)는 여러 줄이어도 한 줄로 접힌다 — 그래서 key=value 한 줄로 안전하다.
          {
            echo "sha=$SHA"
            echo "dry_run=$DRY"
            echo "subject=$(git log -1 --format=%s "$SHA")"
          } >> "$GITHUB_OUTPUT"
          echo "propagate: 반영 대상 $SHA (예행=$DRY)"

  # 2단계: 앱 3곳을 동시에 **준비**한다(밀지 않는다). 한 곳이 실패해도 나머지는 계속한다.
  # 이 job 에서 토큰을 쥐는 단계는 「앱 저장소 클론」 하나뿐이고, 그 단계는 git 말고 아무것도 돌리지 않는다.
  prepare:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [erp, illua, lab]
    env:
      PROPAGATE_APP_ID: ${{ matrix.app }}
      # 산출물(커밋할 파일 + meta.json)이 담기는 자리 — 아래 upload-artifact 가 이 폴더를 통째로 올린다.
      PROPAGATE_OUT: ${{ github.workspace }}/propagate-out
      # 잠금 파일의 `resolved` 가 `git+ssh://git@github.com/…` 라 npm 이 되돌림 경로에서 ssh 를 쓴다.
      # 실행기에는 ssh 열쇠가 없으므로 https 로 바꿔 준다(2026-09-08 로컬 예행에서 이 되돌림이
      # 실제로 쓰이는 것을 확인했다 — 안전망이 아니라 필요한 설정이다).
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "url.https://github.com/.insteadOf"
      GIT_CONFIG_VALUE_0: "ssh://git@github.com/"
    steps:
      - uses: actions/checkout@v4
        with:
          # propagate.sh 가 이 작업 폴더에서 「현재 핀이 새 SHA 의 조상인가」를 잰다.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ★토큰을 쥐는 단계 ①: 클론만 한다. npm 도, 앱 스크립트도 여기서 돌지 않는다.
      #  쓰는 열쇠는 **읽기 전용** PAT 이라, 설령 새더라도 앱 저장소에 아무것도 밀 수 없다.
      - name: 앱 저장소 클론 (${{ matrix.app }})
        shell: bash
        env:
          PROPAGATE_TOKEN: ${{ secrets.PROPAGATE_READ_TOKEN }}
          # 이 단계가 죽어도 **사유를 봉인해서** 올려야 밀기 job 이 그것을 읽어 알린다(F9+F1).
          # 공개키는 시크릿이 아니라 **변수**다 — 새어도 아무것도 열지 못한다.
          PROPAGATE_ARTIFACT_PUBKEY: ${{ vars.PROPAGATE_ARTIFACT_PUBKEY }}
        run: bash scripts/propagate/propagate.sh clone

      # ↓ 여기서부터 앱 코드(npm·설계 등록부·design:check)가 돈다 — **토큰이 없는 자리다.**
      - name: 핀 갱신 준비 (${{ matrix.app }})
        id: prep
        shell: bash
        env:
          PROPAGATE_SHA: ${{ needs.resolve.outputs.sha }}
          # ★커밋 제목 — 아무나 적을 수 있는 글자라 반드시 env 로만 넘긴다.
          PROPAGATE_SUBJECT: ${{ needs.resolve.outputs.subject }}
          PROPAGATE_PACKAGE_DIR: ${{ github.workspace }}
          # ★산출물 봉인(총괄 결정 F9): 이 저장소는 공개라 artifact 를 누구나 내려받는다.
          #  비공개 앱 3곳의 package.json·잠금 파일·설계 등록부가 그대로 공개되지 않게,
          #  올릴 폴더에는 이 공개키로 봉인한 bundle.enc·key.enc 만 넣는다.
          #  **변수가 비어 있으면 준비는 아무것도 올리지 않고 실패한다**(평문 업로드 금지).
          PROPAGATE_ARTIFACT_PUBKEY: ${{ vars.PROPAGATE_ARTIFACT_PUBKEY }}
        run: bash scripts/propagate/propagate.sh prepare

      # ★`always()` 인 이유(2차 리뷰 F1): 준비가 **실패했을 때도** 산출물을 올려야 한다.
      #  스크립트가 어떤 실패에서도 `meta.json {result:"failed", error:"한 줄 사유"}` 를 남기고(lib.sh 의
      #  EXIT 갈고리), 밀기 job 이 그 사유를 읽어 빨갛게 끝내며 **알림도 거기서 한 번만** 보낸다.
      #  건너뛴 경우(같은 핀·후손 아님)에도 meta.json 하나는 이렇게 올라간다.
      - name: 산출물 올리기 (${{ matrix.app }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propagate-${{ matrix.app }}
          path: ${{ github.workspace }}/propagate-out
          if-no-files-found: error
          retention-days: 3

  # 3단계: 준비된 파일을 받아 **밀기만** 한다. 이 job 에서는 npm 도 앱 코드도 돌지 않는다.
  # ★`!cancelled()` 인 이유: `needs: prepare` 는 matrix 3갈래를 **한 덩어리**로 본다. 한 앱이 실패하면
  #  기본 조건에서는 나머지 두 앱의 밀기까지 건너뛴다. 그래서 「취소만 아니면 돈다」로 두고,
  #  산출물이 없는 앱은 아래 밀기 단계가 2(입력 오류)로 빨갛게 끝낸다.
  push:
    needs: [resolve, prepare]
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    # 밀기는 몇 초면 끝나지만 마지막 「배포 확인」이 최대 30분을 기다린다(총괄 결정 6).
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        app: [erp, illua, lab]
    env:
      PROPAGATE_APP_ID: ${{ matrix.app }}
      PROPAGATE_OUT: ${{ github.workspace }}/propagate-out
    steps:
      - uses: actions/checkout@v4
        with:
          # ★이력이 필요하다(2026-09-08 2차 리뷰 F3): 밀기 단계도 「지금 핀이 이번 커밋의 조상인가」를
          #  **자기 눈으로** 다시 본다. 산출물이 말하는 SHA 를 그대로 믿지 않기 때문이다.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 준비 job 이 실패한 앱은 여기서 artifact 가 없다 — 그 사실을 밀기 단계가 말하게 두고
      # 이 단계에서 job 을 멈추지는 않는다(`continue-on-error`).
      - name: 산출물 받기 (${{ matrix.app }})
        id: fetch
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: propagate-${{ matrix.app }}
          path: ${{ github.workspace }}/propagate-out

      # ★토큰을 쥐는 단계 ②: 새로 클론 → 산출물 얹기 → 커밋 → 푸시. npm 은 부르지 않는다.
      - name: 밀기 (${{ matrix.app }})
        id: run
        shell: bash
        env:
          PROPAGATE_TOKEN: ${{ secrets.PROPAGATE_TOKEN }}
          # ★이 두 개가 이 job 이 믿는 유일한 입력이다(2차 리뷰 F3): resolve 가 정한 커밋과
          #  그것을 확인할 수 있는 패키지 저장소. 산출물(artifact)은 여기에 맞는지로만 판정한다.
          PROPAGATE_SHA: ${{ needs.resolve.outputs.sha }}
          PROPAGATE_PACKAGE_DIR: ${{ github.workspace }}
          PROPAGATE_PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.resolve.outputs.sha }}
          PROPAGATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROPAGATE_DRY_RUN: ${{ needs.resolve.outputs.dry_run == 'true' && '1' || '0' }}
          # 봉인을 푸는 열쇠(F9). 이것만 시크릿이다 — 이 job 에서는 앱 코드가 한 줄도 돌지 않는다.
          PROPAGATE_ARTIFACT_PRIVKEY: ${{ secrets.PROPAGATE_ARTIFACT_PRIVKEY }}
        run: bash scripts/propagate/propagate.sh push

      # ★이 저장소의 **유일한 실패 알림 지점**이다(2차 리뷰 F1·F7).
      #  준비 job 에는 알림이 없다 — 앱 코드가 이미 돈 실행기에서 알림 열쇠를 쓰면 변조된 `notify.sh`
      #  하나로 열쇠가 새기 때문이다. 준비가 죽으면 그 사유가 산출물 `meta.json` 에 담겨 오고,
      #  밀기 스크립트가 그것을 읽어 이 job 을 빨갛게 만든다 → 아래 `failure()` 가 그때도 돈다.
      #  그래서 조건은 `failure()` 하나뿐이다(산출물을 받았는지 따지지 않는다 — 못 받은 것도 알려야 한다).
      - name: 실패 알림
        if: failure()
        shell: bash
        env:
          WEDLY_NOTIFY_URL: ${{ vars.WEDLY_NOTIFY_URL }}
          WEDLY_NOTIFY_KEY: ${{ secrets.WEDLY_NOTIFY_KEY }}
          APP_ID: ${{ matrix.app }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PKG_SHA: ${{ needs.resolve.outputs.sha }}
          PKG_SUBJECT: ${{ needs.resolve.outputs.subject }}
        run: |
          # 사유는 **파일에서 읽어 인자로** 넘긴다 — 워크플로우 보간으로 넣으면 남이 적은 글자가 명령이 된다.
          # ★읽기 전에 **보통 파일인지 먼저 본다**(2026-09-08 4차 리뷰 H3 · P2):
          #  산출물 꾸러미가 `meta.json` 을 **이름있는 통로(FIFO)** 로 담아 오면 `readFileSync` 가
          #  쓰는 쪽을 기다리며 **영원히 멈춘다** — 알림이 안 가고 이 job 이 제한 시간까지 매달린다.
          #  `lstat` 은 열지 않고 종류만 보므로 멈추지 않는다. 링크·폴더·장치도 같이 걸러진다.
          #  (밀기 단계가 애초에 그런 꾸러미를 풀지 않지만, 알림은 **마지막 보루**라 스스로도 지킨다.)
          REASON="$(node -e '
            const fs = require("node:fs");
            try {
              const file = process.argv[1];
              const st = fs.lstatSync(file);
              if (!st.isFile()) throw new Error("보통 파일이 아님");
              const meta = JSON.parse(fs.readFileSync(file, "utf8"));
              // ★사유에서 **제어문자·이스케이프**를 지운다(2026-09-08 5차 리뷰 · P2):
              //  `\s` 는 ESC(0x1b)·BEL(0x07) 을 안 잡는다 — 옛 판은 로그 색·커서를 조작하는 글자를
              //  슬랙 알림 줄에 그대로 실어 보냈다. 사유는 앱 코드가 돈 실행기에서 온 글자다(F1 에서
              //  「사유는 공개로 나간다」를 감수했지, 「무엇이든 그대로 싣는다」를 감수한 것이 아니다).
              //  규칙은 밀기 스크립트의 `meta_error` 와 **같다**: C0·DEL·C1 을 한 칸으로 → 공백 접기 → 400자.
              const line = String(meta.error ?? "")
                .replace(/[\u0000-\u001f\u007f-\u009f]+/g, " ")
                .replace(/\s+/g, " ")
                .trim()
                .slice(0, 400);
              process.stdout.write(line ? "사유: " + line : "사유: 밀기 단계에서 실패했습니다 — 위 로그를 보세요.");
            } catch {
              process.stdout.write("사유: 준비 단계 산출물을 받지 못했거나 봉인을 풀지 못했습니다 — 준비·밀기 job 로그를 보세요.");
            }
          ' "$PROPAGATE_OUT/plain/meta.json")"
          bash scripts/propagate/notify.sh \
            "정책매칭 공용 자동 반영 실패: $APP_ID" \
            "$RUN_URL" \
            "패키지 커밋 $PKG_SHA" \
            "$PKG_SUBJECT" \
            "$REASON" \
            "앱 저장소 main 은 바뀌지 않았습니다(옛 핀 그대로). 실행 로그를 보고 사람이 핀을 맞추거나 다시 돌리세요." || true

      # ── 배포 확인 ───────────────────────────────────────────────────────────
      # 민 커밋이 **실제로 배포됐는지**까지 본다(계획서 Task 7 · 총괄 결정 6).
      # Railway 토큰은 쓰지 않는다 — 프로젝트 토큰은 그 환경의 모든 변수(운영 DB 주소·AI 열쇠)를
      # 읽을 수 있어 공개 저장소 시크릿에 두기엔 폭이 너무 넓다. 대신 앱이 아무 인증 없이 내놓는
      # `GET /api/build-id` 를 30초마다 물어 봇 커밋 SHA 가 나타나는지 본다(최대 30분).
      #
      # ★여기서 실패해도 job 은 초록으로 둔다(continue-on-error). 핀 반영은 이미 성공했고
      #  「아직 배포 안 됨」이 반영을 되돌릴 이유는 아니다 — 사람에게는 아래 알림으로 알린다.
      - name: 배포 확인 (${{ matrix.app }})
        if: steps.run.outputs.result == 'updated'
        id: watch
        continue-on-error: true
        shell: bash
        env:
          APP_ID: ${{ matrix.app }}
          COMMIT: ${{ steps.run.outputs.commit }}
        run: |
          set -euo pipefail
          URL="$(node -e '
            // JSON 은 어디서도 require 로 열지 않는다(3차 리뷰 G1) — 읽기로만 연다.
            const fs = require("node:fs");
            const apps = JSON.parse(fs.readFileSync("scripts/propagate/apps.json", "utf8"));
            const app = apps.find((a) => a.id === process.env.APP_ID);
            if (!app || !app.buildIdUrl) {
              console.error("apps.json 에 buildIdUrl 이 없습니다: " + process.env.APP_ID);
              process.exit(1);
            }
            process.stdout.write(app.buildIdUrl);
          ')"
          node scripts/propagate/watch-deploy.mjs "$URL" "$COMMIT" 1800 30

      # 30분 안에 그 커밋이 배포본에 안 보였을 때만 돈다. 빌드 실패인지 그냥 늦는 것인지는
      # 이 방법으로 구분할 수 없다 — 알림 문구가 그렇게 말하고 Railway 화면을 보라고 한다.
      # ★여기는 `|| true` 를 붙이지 않는다(리뷰 R4): 배포 확인이 실패한 마당에 알림까지 실패하면
      #  아무도 모른다. 알림이 실패하면 이 job 을 빨갛게 만들어 GitHub 실패 메일이 가게 한다.
      - name: 배포 미확인 알림
        if: steps.watch.outcome == 'failure'
        shell: bash
        env:
          WEDLY_NOTIFY_URL: ${{ vars.WEDLY_NOTIFY_URL }}
          WEDLY_NOTIFY_KEY: ${{ secrets.WEDLY_NOTIFY_KEY }}
          APP_ID: ${{ matrix.app }}
          COMMIT: ${{ steps.run.outputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/propagate/notify.sh \
            "정책매칭 공용 반영 뒤 배포 확인 못 함: $APP_ID" \
            "$RUN_URL" \
            "봇 커밋 $COMMIT 이 30분 안에 배포본에 나타나지 않았습니다." \
            "Railway 빌드 실패이거나 지연입니다 — Railway 화면에서 확인하세요. 실패면 옛 배포가 그대로 살아 있습니다."
